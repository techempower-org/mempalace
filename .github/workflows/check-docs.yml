name: Check docs

# Auto-trigger scripts/check-docs.sh whenever the fork-ahead doc surface
# changes. Catches drift between docs/fork-changes/ (canonical source, one file per entry)
# and the rendered FORK_CHANGELOG.md, stale commit hashes, mismatched
# upstream PR states, and the README test count.
#
# Issue: techempower-org/mempalace#65
#
# Security note: this workflow only consumes secrets.GITHUB_TOKEN and the
# checked-out repo contents — no untrusted event payload fields (issue
# titles, PR bodies, commit messages) are interpolated into run blocks.

on:
  push:
    branches: [main, develop]
    paths:
      - 'docs/fork-changes/**'
      - 'docs/fork-changes-meta.yaml'
      - 'scripts/render-docs.py'
      - 'scripts/render-api-docs.py'
      - 'scripts/check-docs.sh'
      - 'FORK_CHANGELOG.md'
      - 'README.md'
      - 'CLAUDE.md'
      - 'mempalace/**/*.py'
      - 'website/reference/python-api/**'
      - 'website/.vitepress/api-sidebar.json'
      - '.github/workflows/check-docs.yml'
  pull_request:
    paths:
      - 'docs/fork-changes/**'
      - 'docs/fork-changes-meta.yaml'
      - 'scripts/render-docs.py'
      - 'scripts/render-api-docs.py'
      - 'scripts/check-docs.sh'
      - 'FORK_CHANGELOG.md'
      - 'README.md'
      - 'CLAUDE.md'
      - 'mempalace/**/*.py'
      - 'website/reference/python-api/**'
      - 'website/.vitepress/api-sidebar.json'
      - '.github/workflows/check-docs.yml'
  workflow_dispatch:

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # check-docs.sh resolves commit hashes referenced in docs via
          # `git cat-file -e`; needs full history, not the shallow default.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: 'pip'

      # `pip install -e ".[dev]"` pulls pytest (needed by check-docs.sh
      # step 1 to count collected tests) and PyYAML (needed by
      # scripts/render-docs.py to render the changelog for step 3).
      - run: pip install -e ".[dev]"

      # STRICT_RESOLVED rejects a `commit: HEAD` placeholder, and is set ONLY
      # on a push to main: that is where entries must already be resolved.
      # A pull request legitimately carries HEAD, because the squash commit it
      # will point at does not exist yet. Loud (red on main), never
      # auto-fixing — resolving is the sweep's job, not a checker's.
      - name: Run check-docs.sh
        env:
          # gh CLI is preinstalled on ubuntu-latest runners. Step 4
          # (upstream PR state check) needs an authenticated token to
          # query MemPalace/mempalace PR states; the default GITHUB_TOKEN
          # works for public repo reads.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Rejects a `commit: HEAD` placeholder. Set ONLY on a push to main,
          # where entries must already be resolved; a pull request
          # legitimately carries HEAD because the squash commit it will point
          # at does not exist yet.
          STRICT_RESOLVED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '0' }}
        run: bash scripts/check-docs.sh
