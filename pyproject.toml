[project]
name = "mempalace"
version = "3.9.0"
description = "Give your AI a memory — mine projects and conversations into a searchable palace. No API key required."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "milla-jovovich"},
]
keywords = [
    "ai", "memory", "llm", "rag", "chromadb", "mcp",
    "vector-database", "claude", "chatgpt", "embeddings",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
dependencies = [
    "chromadb>=1.5.4,<2",
    "pyyaml>=6.0,<7",
    "tomli>=2.0.0; python_version < '3.11'",
    # Multilingual embedding model deps. Onboarding now offers the
    # embeddinggemma-300m ONNX model as the default for new installs, so
    # these are required core deps (not optional extras). The 300 MB ONNX
    # model itself is lazy-downloaded on first use, not at install time.
    # Users who pick minilm during onboarding still get these installed
    # but unused — small wheel-size cost in exchange for one fewer pip
    # command in the multilingual setup path.
    "huggingface_hub>=1.0",
    # Lower bound is 0.22, not 0.23: the [rerank] extra pulls
    # sentence-transformers → transformers, whose current releases pin
    # ``tokenizers>=0.22.0,<=0.23.0`` (e.g. transformers 5.9.0). A bare
    # ``>=0.23`` floor sits above the bottom of that window, leaving the
    # resolver only the single point 0.23.0 to satisfy both — which sends
    # pip into long backtracking and ultimately ResolutionImpossible on a
    # fresh ``pip install mempalace[rerank]`` (techempower-org/mempalace#333).
    # 0.22 matches what the rerank stack actually resolves to (0.22.2), and
    # mempalace's only direct use (embedding.py: ``Tokenizer.from_file``) is
    # stable well below 0.22. Upper guard ``<0.24`` keeps it bounded.
    "tokenizers>=0.22,<0.24",
    "numpy>=2.0",
    # Tier 6a content-date extraction uses dateutil for natural-language
    # date parsing (filename + content body branches). It happens to install
    # transitively today via chromadb→kubernetes→python-dateutil, but that
    # chain is not a contract — declared explicitly here to ensure
    # _extract_content_date keeps working if upstream kubernetes drops the
    # dependency. Per PR #1584 review (Igor, 2026-05-22).
    "python-dateutil>=2.9",
]

[project.urls]
Homepage = "https://github.com/MemPalace/mempalace"
Repository = "https://github.com/MemPalace/mempalace"
"Bug Tracker" = "https://github.com/MemPalace/mempalace/issues"

[project.scripts]
mempalace = "mempalace.cli:main"
mempalace-mcp = "mempalace.mcp_proxy:main"
mempalace-kg-extract = "mempalace.kg_triple_worker:cli_main"
mempalace-light-mcp = "mempalace.mcp_light_server:main"

[project.entry-points."mempalace.backends"]
chroma = "mempalace.backends.chroma:ChromaBackend"
milvus = "mempalace.backends.milvus:MilvusBackend"
postgres = "mempalace.backends.postgres:PostgresBackend"
pgvector = "mempalace.backends.pgvector:PgVectorBackend"
qdrant = "mempalace.backends.qdrant:QdrantBackend"
sqlite_exact = "mempalace.backends.sqlite_exact:SQLiteExactBackend"
rust_exact = "mempalace.backends.rust_exact:RustExactBackend"

# RFC 002 source-adapter entry-point group. First-party adapters land here as
# they migrate onto ``BaseSourceAdapter``; third-party adapter packages
# (``mempalace-source-cursor``, ``mempalace-source-git``, …) also register
# under this group.
[project.entry-points."mempalace.sources"]
filesystem = "mempalace.sources.filesystem:FilesystemSourceAdapter"
conversations = "mempalace.sources.conversations:ConversationSourceAdapter"
opencode = "mempalace.sources.opencode:OpenCodeSourceAdapter"
codex = "mempalace.sources.codex:CodexSourceAdapter"
gemini = "mempalace.sources.gemini:GeminiSourceAdapter"
aider = "mempalace.sources.aider:AiderSourceAdapter"
warp = "mempalace.sources.warp:WarpSourceAdapter"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # Retries known-transient ChromaDB-on-Windows HNSW compaction failures in CI
    # (wired only into the test-windows job in ci.yml, scoped to the specific
    # error). Local/Linux/macOS runs never rerun, so real failures stay loud.
    "pytest-rerunfailures>=12.0",
    "ruff==0.16.6",
    "psutil>=5.9",
    "hypothesis>=6.0",
    "pre-commit>=3.0",
    "mypy>=1.0",
]
postgres = ["psycopg[binary]>=3.2,<4", "psycopg-pool>=3.2,<4"]
spellcheck = ["autocorrect>=2.0"]
# Opt-in Milvus backend. Defaults to per-palace Milvus Lite
# (`<palace>/milvus.db`); set MEMPALACE_MILVUS_URI and
# MEMPALACE_MILVUS_TOKEN to point at Milvus server or Zilliz Cloud.
milvus = [
    "pymilvus>=3.0.0",
    "milvus-lite>=3.0; python_version >= '3.10' and sys_platform != 'win32'",
]
# Async LLM-based KG triple extraction worker (mempalace-kg-extract CLI).
# httpx for the OpenAI-compatible chat-completions client; psycopg3 +
# psycopg-pool for the queue + AGE writes. Async pool lets the worker
# run real concurrent writes (~24-wide) instead of serializing through
# one psycopg2 connection under an asyncio.Lock.
kg-extract = [
    "httpx>=0.28",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
]
# Opt-in Postgres + pgvector backend. Only the psycopg driver is needed on the
# client; the server must have the `vector` extension available. Selected via
# MEMPALACE_BACKEND=pgvector / --backend pgvector; never required for the
# default (Chroma) install.
pgvector = ["psycopg[binary]>=3.1"]
# Hardware acceleration for the ONNX embedding model. Install exactly one:
#   pip install mempalace[gpu]       — NVIDIA CUDA
#   pip install mempalace[dml]       — DirectML (Windows AMD/Intel/NVIDIA)
#   pip install mempalace[coreml]    — macOS Neural Engine
# After install, set MEMPALACE_EMBEDDING_DEVICE=cuda|dml|coreml (or "auto").
gpu = ["onnxruntime-gpu>=1.16"]
dml = ["onnxruntime-directml>=1.16"]
coreml = ["onnxruntime>=1.16"]
# Multilingual extra kept as a no-op alias for back-compat with
# `pip install mempalace[multilingual]` — these deps now ship in core.
multilingual = []
# Optional cross-encoder reranking (techempower-org/mempalace#179). Pulls
# sentence-transformers + torch (~2 GB) — heavy enough that it ships as an
# opt-in extra rather than a core dependency. Enable at query time via
# MEMPALACE_RERANK_CROSS_ENCODER=1 (env) or "cross_encoder_rerank": true
# (config.json). Defaults to the 22M ms-marco-MiniLM-L-6-v2 model — runs on
# CPU, captures most of the rerank value per the True Memory ablation.
rerank = ["sentence-transformers>=2.7"]
# Binary-format extraction for `mempalace mine --mode extract`. Per-format
# transformer routing: striprtf for .rtf, MarkItDown for .pdf/.docx/.pptx/
# .xlsx/.epub. MarkItDown requires Python ≥ 3.10; the env marker stays as a
# safety belt for downstream consumers who may still resolve on older Pythons.
extract = [
    "striprtf>=0.0.27",
    # Per PR #1555 review (Igor): bare ``markitdown`` is enough to import
    # but not enough to convert — actual PDF/DOCX/PPTX/XLSX extraction
    # needs MarkItDown's per-format sub-extras, which pull pdfminer-six,
    # mammoth, python-pptx, openpyxl, etc. EPUB is handled by base
    # markitdown (EpubConverter uses beautifulsoup4, a base requirement),
    # so no [epub] sub-extra is needed (and none exists in 0.1.5). RTF is
    # covered by striprtf above.
    "markitdown[docx,pdf,pptx,xlsx]>=0.1.5; python_version >= '3.10'",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # Retries known-transient ChromaDB-on-Windows HNSW compaction failures in CI
    # (wired only into the test-windows job in ci.yml, scoped to the specific
    # error). Local/Linux/macOS runs never rerun, so real failures stay loud.
    "pytest-rerunfailures>=12.0",
    "ruff==0.16.6",
    "psutil>=5.9",
    "hypothesis>=6.0",
    "pre-commit>=3.0",
    "mypy>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mempalace"]

[tool.ruff]
line-length = 100
target-version = "py310"
# "*.md": ruff 0.16 began formatting Python inside markdown fences, which
# pulls ~96 docs into scope and reflows hand-aligned example code (the
# column-aligned field comments in docs/rfcs/002 are deliberate). Docs are
# authored prose, not linted source — keep the formatter on real modules.
extend-exclude = ["benchmarks", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "C901"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# mcp_server fragments exec into the package namespace. Names they use live
# in __init__.py and earlier fragments, so F821 is expected; __init__.py
# imports those names for the fragments, so F401 is expected there too.
"mempalace/mcp_server/__init__.py" = ["F401"]
"mempalace/mcp_server/_*.py" = ["F821"]
"mempalace/mcp_server/tools_*.py" = ["F821"]
"mempalace/mcp_server/schemas.py" = ["F821"]
"mempalace/mcp_server/protocol.py" = ["F821"]
"mempalace/mcp_server/http.py" = ["F821"]
"mempalace/mcp_server/runtime.py" = ["F821"]
# cli fragments exec into the package namespace. Names they use live in
# __init__.py and earlier fragments, so F821 is expected; __init__.py
# imports those names for the fragments, so F401 is expected there too.
"mempalace/cli/__init__.py" = ["F401"]
"mempalace/cli/_*.py" = ["F821"]
"mempalace/cli/cmd_*.py" = ["F821"]
"mempalace/cli/parser.py" = ["F821"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not benchmark and not slow and not stress'"
markers = [
    "benchmark: scale/performance benchmark tests",
    "slow: tests that take more than 30 seconds",
    "stress: destructive scale tests (100K+ drawers)",
]
filterwarnings = [
    # Many tests build raw-chromadb palaces directly (no recorded embedder
    # identity), which correctly emits this on open. The behavior itself is
    # asserted in tests/test_embedder_identity.py; ignore the fixture noise.
    # Matched by message (not by class path) so pytest does not import the
    # mempalace package at config time — importing it before coverage starts
    # would drop module-level lines from the report.
    "ignore:palace collection.*has no recorded embedder identity",
]

[tool.coverage.run]
source = ["mempalace"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "if __name__",
    "pragma: no cover",
]
