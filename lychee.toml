# Lychee link-checker config for fork docs.
#
# Run locally:
#   lychee --config lychee.toml README.md CLAUDE.md FORK_CHANGELOG.md docs/
#
# Format reference:
#   https://github.com/lycheeverse/lychee/blob/master/lychee.example.toml

# Accept 2xx and 3xx. 202 is listed explicitly: towardsdatascience.com
# (Medium) answers 202 Accepted to bots on every run (5 of 5 main pushes,
# 2026-10-03). It is a success code, and accepting it keeps checking that host
# for real 404s, which excluding the host would not. Some GitHub anchor URLs return 403 to anonymous
# scrapers even when the page exists (anti-abuse heuristics); accept 403
# and 429 too rather than chase per-URL exclusions.
accept = ["200", "202", "206", "301", "302", "303", "304", "307", "308", "403", "429"]

# Retry transient failures. CI is the noisy environment, not the
# real link state.
max_retries = 2
retry_wait_time = 5

# Be patient with slow upstream hosts (e.g. paper PDFs on academic CDNs).
timeout = 30

# Respect crawl budget — don't hammer a host with parallel probes.
max_concurrency = 8

# User-Agent some hosts (Twitter, LinkedIn, anti-bot CDNs) need to
# return a real response instead of 403.
user_agent = "lychee/0.24 (+https://github.com/techempower-org/mempalace)"

# Skip URLs that match these patterns. Keep this list small and
# documented — every entry is a hole in coverage.
exclude = [
    # Local / loopback — sometimes appears in example configs.
    '^https?://(localhost|127\.0\.0\.1|0\.0\.0\.0)(:|/|$)',

    # Upstream CHANGELOG compare links: develop's changelog structurally runs
    # ahead of the release tags (v3.6/v3.7 hit this 2026-08-09, v3.7.1/v3.8.0
    # again 2026-08-20), so these 404 until each release is tagged. Compare
    # links to EXISTING tags resolve fine but carry no lint value — exclude
    # the whole family instead of chasing each release.
    '^https://github\.com/MemPalace/mempalace/compare/',

    # Private homelab hostnames (jphe.in subdomains) — not reachable
    # from GitHub runners. These are docs about JP's internal deploy.
    '^https?://[a-z0-9.-]+\.jphe\.in(:|/|$)',

    # jphein/mempalace transferred to techempower-org/mempalace and
    # GitHub's redirect can return 404 to unauthenticated scrapers.
    '^https://github\.com/jphein/mempalace(/|$)',

    # familiar.realm.watch is a PRIVATE repo (under both owners), so every link
    # into it 404s to an unauthenticated checker. They are real links for
    # people with access. Excluding them turned lychee green on main, which had
    # failed on 12 of these 404s on every push (measured 2026-10-03, last 5).
    '^https://github\.com/(jphein|techempower-org)/familiar\.realm\.watch(/|$)',

    # Anthropic preview/beta docs URLs occasionally 404 during platform
    # rollouts. We track these in fork-changes.yaml; CI link-checking
    # them adds noise without catching real drift.
    '^https://platform\.claude\.com/docs/.*/(managed-agents|dreams)',

    # Mailto and tel: schemes — not useful to validate.
    '^mailto:',
    '^tel:',

    # Example.com and reserved demo domains used in code samples.
    '^https?://(www\.)?example\.(com|org|net)(/|$)',

    # Placeholder commit hashes in FORK_CHANGELOG.md for future-dated
    # entries — replaced with real SHAs when the entry lands.
    '^https://github\.com/techempower-org/mempalace/commit/TBD$',

    # External sites that 404 from CI but are intentionally referenced
    # in research/comparison docs. Archival pointers, not active links.
    '^https://github\.com/kostadis/CampaignGenerator(/|$)',
    '^https://github\.com/milla-jovovich/mempalace(/|$)',
    '^https://github\.com/jphein/notebook(/|$)',
    '^https://github\.com/google/gemini-cli(/|$)',
    '^https://github\.com/techempower-org/mempalace-viz(/|$)',
    '^https://github\.com/techempower-org/multipass-structural-memory-eval(/|$)',
    # doobidoo/mcp-memory-service was deleted/renamed upstream (404 as of
    # 2026-05-31); referenced in README landscape + the memory-system
    # benchmark survey as a comparison pointer, not an active link.
    '^https://github\.com/doobidoo/mcp-memory-service(/|$)',
    # 199-biotechnologies/engram-2 was deleted/renamed upstream (404 as of
    # 2026-06-10); referenced in ECOSYSTEM + research docs as a comparison
    # pointer, not an active link.
    '^https://github\.com/199-biotechnologies/engram-2(/|$)',
    '^https://www\.usenotra\.com(/|$)',
    '^https://celiums\.ai(/|$)',
    '^https://mempalaceofficial\.com(/|$)',

    # martinfowler.com appears to block datacenter IPs (3 consecutive
    # 30-second timeouts from GitHub runners as of 2026-05-26). The page
    # is live in browsers; just unreachable from CI.
    '^https://martinfowler\.com/',

    # csail.mit.edu sits behind a slow CDN that intermittently fails
    # the 30s lychee timeout — three CI failures across PRs #232 and
    # #226 on 2026-05-26, two of them on rerun. Page is live in
    # browsers. Cited from docs/research/uncertainty-aware-retrieval.md.
    '^https://www\.csail\.mit\.edu/',
]

# Exclude path patterns from the *scan* (not just from URL checking).
# These directories contain intentionally-broken examples or
# scratch/working state that shouldn't gate CI.
exclude_path = [
    "scratch/",
    "node_modules/",
    ".venv/",
    "venv/",
    ".git/",
    "build/",
    "dist/",
    "htmlcov/",
    "tests/",
    "website/_site/",
]

# Don't fail on missing input files — globs may not match anything in
# subset checkouts.
skip_missing = true
