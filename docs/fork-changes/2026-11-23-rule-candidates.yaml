seq: 213
id: rule-candidates
date: '2026-11-23'
bucket: Added
commit: HEAD
area: Mining
summary: the convo miner lists user lines that read as standing rules for review; `mempalace rules --since` prints them
body: |
  A rule said once in a session ("we should use the good dragon voices") sat
  in the palace verbatim with no memory, no CLAUDE.md line and no hook, and a
  lane in another project broke it (#584). Now every line of the user's
  messages that reads as a standing rule (always / never / every / "we should
  use" / "standing rule" / "from now on" / "I thought we") is appended verbatim,
  with the id of the newly filed drawer holding it, to
  `~/.mempalace/rule_candidates/rule-candidates-YYYY-MM-DD.md`
  (`MEMPALACE_RULE_CANDIDATES_DIR`; `MEMPALACE_RULE_CANDIDATES=0` turns it off).
  A line whose words cover an existing memory's `name:` slug
  (`MEMPALACE_RULE_MEMORY_GLOB`, default `~/.claude/projects/*/memory/*.md`) is
  dropped, and a line already listed on an earlier day is not listed again.
  Subagent transcripts and harness-injected turns are skipped. The check runs on
  the user's messages as `normalize.collect_user_messages` gathers them, not on
  the rendered chunk text: the transcript marks only a message's first line with
  `>`, so a rule on its third line would otherwise be missed and an assistant
  blockquote taken for the user's. The flagging never fails a mine.
  `mempalace rules --since YYYY-MM-DD` prints the lists.
tests: '14 (tests/test_rule_candidates.py)'
