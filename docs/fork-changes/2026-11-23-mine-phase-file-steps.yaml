id: mine-phase-file-steps
date: '2026-11-23'
bucket: Added
commit: HEAD
area: Mining
summary: the mine phase file names the step inside a file (lock, reconcile, refresh, write, purge), so a one-transcript mine that waits for hours says where
body: |
  The phase file (#548) said `file` for everything between chunking a
  transcript and finishing it: waiting on the per-file lock, reading what
  the palace already holds, the metadata refresh, embedding and writing,
  and the stale-drawer purge. A drain mine is one transcript, so the
  11 h 26 m wait in #548 would still have read only "phase file".

  Each of those steps now reports its own phase with the file counts
  (`file`, `files_total`, `chunks`) carried through, plus `written` /
  `changed` while writing and `orphans` while purging. `lock` is written
  before the blocking flock, so a wait on another holder reads as `lock`,
  not as embedding. The palace-daemon heartbeat prints the phase name
  as-is, so no daemon change is needed.
tests: '2 new, 1 updated (test_mine_phase: the phase file reads lock with the file counts while the per-file lock is entered; a re-mine of a shrunk file walks lock, reconcile, refresh, purge in order with an orphan count; the walk-order test now expects lock, reconcile and write inside file). Removing the lock, reconcile or purge report each turns one red'
