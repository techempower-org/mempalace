seq: 206
id: mask-endpoint-credentials
date: '2026-11-15'
bucket: Fixed
commit: 51c96db
area: Security
summary: LLM and embedding errors never repeat an endpoint's reply or reason, mask the URL, and keep no original exception
body: |
  A port of upstream 857fbec4 onto the fork's own llm_client and
  embedding modules, hardened in review. An error now names the endpoint
  by a safe label (scheme, host, port and a plain path; never userinfo, a
  query or a fragment, and "the configured endpoint" when the URL does not
  parse cleanly) and describes the failure in fixed words: the HTTP status
  (401 and 403 say "authentication failed"), the exception's type and the
  OS's own words for its errno, or the position of a JSON error. It never repeats the endpoint's reply, its HTTP reason or
  an exception's text, because no pattern reliably finds an arbitrary key
  in untrusted text; an embedding reply with an "error" field is reported
  as having one. Every wrap uses `from None`, and the request is built
  inside the guard, so a bad URL's own text never reaches a traceback.
  Behaviour change: read an endpoint's error message by querying it
  directly.
