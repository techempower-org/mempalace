seq: 213
id: judged-parent-lookup-indexes
date: '2026-11-21'
bucket: Changed
commit: HEAD
area: Performance
summary: index the judged-parent lookup keys; `mempalace lookup-indexes` builds missing ones online
body: |
  The search path hides results whose logical parent is judged out. For ids
  it cannot find directly, it runs get(where={key: {"$in": missing}},
  limit=256) for parent_drawer_id and parent_entry_id. Those ids are missing
  by construction, and neither key had an index. So the plan walked the
  primary key over every row until the role's statement_timeout cancelled
  it. On a 1.5 M-drawer palace that was 104 cancellations in 24 h, and a
  search that hit both keys took 64.7 s.

  A new palace now creates both indexes, as it does
  metadata->>'source_file'. An existing palace runs `mempalace
  lookup-indexes`. It works on a side connection with statement_timeout
  lifted for that session, on the table the collection's own statements
  reach. It holds a per-table advisory lock, so two runs never build or drop
  under each other:
  - it builds each missing lookup index with CREATE INDEX CONCURRENTLY and
    marks it as its own (COMMENT ON INDEX with a build id). It drops an
    INVALID index only when it is provably its own: marked by an earlier
    run, or made by this run's CREATE. A failed build is reported by index
    name (exit 1), and the run tries to drop its own INVALID leftover; if
    that fails it marks the leftover for the next run, and the `leftover`
    field says what happened. Any other index under the lookup name,
    including an unmarked one of the same shape, is reported and left
    alone;
  - every run except --dry-run ANALYZEs the table. An expression index has
    no statistics until then, and the planner keeps its default guess and the
    old plan;
  - it EXPLAINs the exact statement the judged-parent lookup sends and
    checks that both its per-value plan and its generic plan use one of the
    key's valid indexes.

  A where-filter on source_file, parent_drawer_id or parent_entry_id now
  names its key literally (metadata->>'parent_drawer_id') instead of binding
  it as a parameter. psycopg prepares a statement after a few runs, and a
  generic plan for metadata->>$1 can't use an expression index on one key.
  A lookup index name longer than PostgreSQL's 63 bytes gets a hash suffix,
  so a long table name can't give two keys the same truncated name.
  On the palace it was measured on, the first search fell from 64.7 s to
  2.3 s.
